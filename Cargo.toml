[package]
name = "mcp-shell-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }

# Windows has no process-group/signal equivalent to setsid+pkill, so a
# Job Object is used instead to make sure a whole command's process tree
# (not just the top-level powershell.exe) is torn down on timeout.
[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects"] }
